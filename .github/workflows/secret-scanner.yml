name: 🔐 Secret Scanner

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  secrets:
    name: Detect Secrets & Credentials
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check git diff for secrets
        id: check-diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DIFF=$(git diff origin/${{ github.base_ref }}...HEAD -- . ":(exclude)hooks/" ":(exclude)scripts/" ":(exclude).github/workflows/" || git diff HEAD -- . ":(exclude)hooks/" ":(exclude)scripts/" ":(exclude).github/workflows/")
          else
            if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              DIFF=$(git diff HEAD~1 HEAD -- . ":(exclude)hooks/" ":(exclude)scripts/" ":(exclude).github/workflows/")
            else
              DIFF=$(git diff 4b825dc642cb6eb9a0ff3e07f461e03f5466297d HEAD -- . ":(exclude)hooks/" ":(exclude)scripts/" ":(exclude).github/workflows/")
            fi
          fi

          P1="BEGIN RSA"
          P2="PRIVATE KEY"
          P3="BEGIN OPENSSH"
          REGEX_PAT="(${P1} ${P2}|${P3} ${P2}|GITHUB_TOKEN\s*=|api_key\s*=|AKIA[0-9A-Z]{16}|aws_secret_access_key|firebase_key|stripe_secret)"
          if echo "$DIFF" | grep -qE "$REGEX_PAT"; then
            echo "found_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "found_secrets=false" >> $GITHUB_OUTPUT
          fi

      - name: Fail if secrets detected
        if: steps.check-diff.outputs.found_secrets == 'true'
        run: exit 1
